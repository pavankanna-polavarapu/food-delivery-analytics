version: 2

models:
  - name: dim_customers
    description: "One row per customer. Descriptive attributes only; history lives in snap_customers."
    latest_version: 2
    config:
      contract:
        enforced: true
    columns:
      - name: customer_id
        data_type: number(38,0)
        data_tests: [unique, not_null]
      - name: customer_name
        data_type: varchar
      - name: email
        data_type: varchar
      - name: phone
        data_type: varchar
      - name: city
        data_type: varchar
      - name: signup_date
        data_type: date
    versions:
      - v: 1
        defined_in: dim_customers
        deprecation_date: 2027-03-01
      - v: 2
        columns: 
          - include: all
            exclude: [email, phone]

  - name: dim_customer_metrics
    description: "One row per customer with at least one delivered order. Lifetime stats derived from fct_orders."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: dim_restaurants
    description: "One row per restaurant."
    config:
      contract: 
        enforced: true
    columns:
      - name: restaurant_id
        data_type: number(38,0)
        constraints:
          - type: not_null
          - type: primary_key
        data_tests: [unique, not_null]
      - name: restaurant_name
        data_type: varchar
      - name: city
        data_type: varchar
      - name: cuisine
        data_type: varchar
      - name: cuisine_type_cleaned
        data_type: varchar
      - name: avg_rating
        data_type: float
      - name: is_active
        data_type: boolean

  - name: dim_delivery_partners
    description: "One row per delivery partner."
    columns:
      - name: partner_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: "Calendar dimension, one row per day."
    columns:
      - name: date_day
        data_tests: [unique, not_null]
  
  - name: fct_orders
    description: "Grain: one row per valid order."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_id
          - not_null:
              config:
                severity: warn
      - name: restaurant_id
        data_tests:
          - relationships:
              to: ref('dim_restaurants')
              field: restaurant_id
              config:
                severity: warn
      - name: order_date
        data_tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: total_amount
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: fct_deliveries
    description: "Grain: one row per delivery with valid timestamps."
    columns:
      - name: delivery_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - unique
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: partner_id
        data_tests:
          - relationships:
              to: ref('dim_delivery_partners')
              field: partner_id
      - name: delivery_minutes
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0